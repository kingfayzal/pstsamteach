# Local Postgres matching Supabase (Postgres 17). Start with `npm run db:up`.
# Trust auth is safe here because the port is bound to this machine only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pstsamteach
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local LiveKit server for video sessions. Start with `npm run livekit:up`.
  # It uses the same key and secret as the app, from .env (see .env.example).
  # The "video" profile keeps it out of a plain `docker compose up`.
  livekit:
    image: livekit/livekit-server:v1.13.7
    profiles: ["video"]
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

volumes:
  pgdata:
