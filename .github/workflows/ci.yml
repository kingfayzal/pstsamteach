name: CI

# main is production and dev is where features are integrated and tested first;
# feature branches reach both through pull requests.
on:
  push:
    branches: [main, dev]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres@localhost:5432/pstsamteach
  DIRECT_URL: postgresql://postgres@localhost:5432/pstsamteach
  TEST_DATABASE_URL: postgresql://postgres@localhost:5432/pstsamteach_test
  E2E_DATABASE_URL: postgresql://postgres@localhost:5432/pstsamteach_e2e

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: pstsamteach
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: pstsamteach
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The video room tests start this image (scripts/e2e-livekit.mjs); pulling first keeps that within its start-up timeout.
      - run: docker pull livekit/livekit-server:v1.13.7
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
